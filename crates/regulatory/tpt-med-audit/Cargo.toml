[package]
name = "tpt-med-audit"
description = "SHA-256 hash chains and HMAC-SHA256 signatures for tamper-evident audit logs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "README.md"
documentation = "https://docs.rs/tpt-med-audit"
keywords = ["sha256", "hmac", "audit-log", "hash-chain", "tamper-evident"]
categories = ["cryptography", "security"]

[features]
default = []
# Asymmetric (Ed25519) signatures for non-repudiation, alongside the
# symmetric HMAC path. Off by default: the WASM footprint stays
# dependency-free unless a caller asks for it.
ed25519 = ["dep:ed25519-dalek"]

[dependencies]
ed25519-dalek = { version = "2", default-features = false, features = [
    "fast",
    "signature",
    "zeroize",
], optional = true }


[lints]
workspace = true
