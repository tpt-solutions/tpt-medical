name: Docs

on:
  push:
    branches: [master]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build rustdoc
        run: cargo doc --workspace --no-deps --document-private-items
      - name: Build mdBook user guide
        run: |
          mdbook build docs/book
        continue-on-error: true # mdBook optional until guide content matures
      - name: Assemble site
        run: |
          mkdir -p site/api
          cp -r target/doc/* site/api/
          if [ -d docs/book/book ]; then cp -r docs/book/book/* site/; fi
          echo '<meta http-equiv="refresh" content="0; url=api/tpt_med_core/">' > site/index.html
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
