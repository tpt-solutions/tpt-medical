name: CI

on:
  push:
    branches: [master]
  pull_request:
  merge_group:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    name: Formatting
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Cargo features are additive per crate, not workspace-wide, so a
      # feature-gated module (e.g. tpt-med-dicom's `rle`/`jpeg`/`jpeg-ls`/
      # `jpeg2000`, tpt-med-nifti's `gzip`) needs its own pass or
      # `--workspace` never compiles it.
      - run: cargo clippy -p tpt-med-dicom --all-targets --features rle,jpeg,jpeg-ls,jpeg2000 -- -D warnings
      - run: cargo clippy -p tpt-med-nifti --all-targets --features gzip -- -D warnings
      - run: cargo clippy -p tpt-med-audit --all-targets --features ed25519 -- -D warnings

  test:
    name: Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        profile: [dev, release]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --workspace --profile ${{ matrix.profile }}
      - run: cargo test -p tpt-med-dicom --features rle,jpeg,jpeg-ls,jpeg2000 --profile ${{ matrix.profile }}
      - run: cargo test -p tpt-med-nifti --features gzip --profile ${{ matrix.profile }}
      - run: cargo test -p tpt-med-audit --features ed25519 --profile ${{ matrix.profile }}

  build:
    name: Build (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
          - target: wasm32-unknown-unknown
            os: ubuntu-latest
            wasm: true
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo check --workspace --target ${{ matrix.target }}
        if: ${{ !matrix.wasm }}
      - name: Check WASM crate
        if: ${{ matrix.wasm }}
        run: cargo check -p tpt-med-wasm --target wasm32-unknown-unknown

  crate-docs:
    name: Crate docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Per-crate README/CHANGELOG + crates.io metadata
        run: bash scripts/check-crate-docs.sh

  golden-drift:
    name: Golden dataset drift
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The drift table compares the working tree against the base branch,
          # so the base history must be present.
          fetch-depth: 0
      - name: Render numeric drift for test-data/golden
        # Fails when a golden value moved beyond the tolerance the golden file
        # itself declares, or when a field was added or removed. Numerical
        # behaviour is API in this project, so a silent change to a reference
        # value is a breaking change and must be justified in the PR.
        run: bash scripts/diff-golden.sh "origin/${{ github.base_ref || 'master' }}"
      - name: Upload drift table
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: golden-drift
          path: test-data/golden
          retention-days: 30

  msrv:
    name: MSRV
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.82"
      - run: cargo check --workspace
